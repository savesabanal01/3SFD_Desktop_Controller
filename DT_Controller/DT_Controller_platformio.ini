; ******************************************************************************************
; working environment for template of custom firmware
; ******************************************************************************************
; Common build settings across this custom device
[env_DT_Controller]
build_flags =
	${env.build_flags}												; include standard build flags
	-DMF_CUSTOMDEVICE_SUPPORT=1										; Required for Custom Devices
	;-DMF_CUSTOMDEVICE_HAS_UPDATE									; if the custom device needs to be updated, uncomment this. W/o the following define it will be done each loop()
	;-DMF_CUSTOMDEVICE_POLL_MS=10 									; time in ms between updating custom device, uncomment this if custom device needs to be updated regulary
	;-DHAS_CONFIG_IN_FLASH											; undefine this and add your configuration to MFCustomDevicesConfig.h to save the config in Flash !!Core FW version must be at least 2.5.2!!
	;-DREVERSED_OUTPUT_OUTPUT										; for reversed output logic on outputs
	;-DREVERSED_OUTPUT_OUTPUTSHIFTER								; for reversed output logic on outputshifter
	;-DDEBUG2CMDMESSENGER											; uncomment this to get debug messages for the connector log
	-I./src/src/MF_CustomDevice										; don't change this one!
	-I./DT_Controller													; Include files for your custom device, replace "DT_Controller" by your folder name
build_src_filter = 
	+<../DT_Controller>													; build files for your custom device, replace "DT_Controller" by your folder name
lib_deps =															; You can add additional libraries if required
	bodmer/TFT_eSPI@^2.5.43	
	robtillaart/RunningAverage@^0.4.8
; custom_core_firmware_version = RP2350_support	; CAUTION check get_version.py and get_CoreFiles.py		
custom_core_firmware_version = 3.0.0	; CAUTION check get_version.py and get_CoreFiles.py								; define the version from the core firmware files your build should base on
custom_source_folder = DT_Controller										; path to your Custom Device Sources, replace "DT_Controller" by your folder name
custom_community_project = 	SaveS_DT_Controller								; Folder name inside zip file, also ZIP file name if "custom_zip_filename" is not changed
custom_zip_filename = ${env_DT_Controller.custom_community_project}		; Name of the zip-file, overwrite it to define an different zip-file name

; Build settings for the WeAct RP2350B
[env:saves_dt_controller_weact_pga2350B]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic_rp2350
framework = arduino
board_build.core = earlephilhower						; select new core
board_build.filesystem_size = 0M						; configure filesystem size. Default 0 Mbyte.
lib_ldf_mode = chain+
upload_protocol = mbed									; for debugging upoading can be changed to picoprobe
;debug_tool = picoprobe									; and uncomment this for debugging w/ picoprobe
;board_build.arduino.earlephilhower.usb_manufacturer = Custom Manufacturer
;board_build.arduino.earlephilhower.usb_product = Ultra Cool Product
;board_build.arduino.earlephilhower.usb_vid = 0x2E8A
;board_build.arduino.earlephilhower.usb_pid = 0xF00A
build_flags =
	${env_DT_Controller.build_flags}
	'-DMOBIFLIGHT_TYPE="SaveS DT_Controller WeAct PGA2350B"'
	'-DMOBIFLIGHT_NAME="SaveS DT_Controller WeAct PGA2350B"'
	-I./src/_Boards/RaspberryPi/Pico
	-DMEMLEN_CONFIG=1500											; MUST be less than EEPROM_SIZE!! MEM_OFFSET_CONFIG + MEM_LEN_CONFIG <= EEPROM_SIZE, see: eeprom_write_block (MEM_OFFSET_CONFIG, configBuffer, MEM_LEN_CONFIG);
	-DMEMLEN_NAMES_BUFFER=1000										; max. size for configBuffer, contains only names from inputs
	-DMF_MAX_DEVICEMEM=1000											; max. memory size for devices
	-I./boards/generic_rp2350B
	-D USER_SETUP_LOADED=1
	-D GC9A01_DRIVER=1
	-D TFT_WIDTH=240
	-D TFT_HEIGHT=240
	-D TFT_MOSI=20
	-D TFT_SCLK=19
	-D TFT_CS=23
	-D TFT_DC=22
	-D TFT_RST=21
	-D LOAD_GLCD=1
	-D LOAD_FONT2=1
	-D LOAD_FONT4=1
	-D LOAD_FONT6=1
	-D LOAD_FONT7=1
	-D LOAD_FONT8=1
	-D LOAD_GFXFF=1
	-D SMOOTH_FONT=1
	-D SPI_FREQUENCY=80000000
	-D TFT_BL=24
	-D TFT_RGB_ORDER=TFT_RBG
	-D TFT_BACKLIGHT_ON=HIGH
	-D TFT_INVERSION_ON=1
build_src_filter =
	${env.build_src_filter}											; don't change this one!
	${env_DT_Controller.build_src_filter}								; don't change this one!
lib_deps =
	${env.lib_deps}													; don't change this one!
	${env_DT_Controller.lib_deps}										; don't change this one!
	${env.custom_lib_deps_Pico}										; don't change this one!
monitor_speed = 115200
extra_scripts = 
	${env.extra_scripts}
custom_core_firmware_version = ${env_DT_Controller.custom_core_firmware_version}	; don't change this one!
custom_community_project = ${env_DT_Controller.custom_community_project}			; don't change this one!
custom_source_folder = ${env_DT_Controller.custom_source_folder}					; don't change this one!
custom_zip_filename = ${env_DT_Controller.custom_zip_filename}			; don't change this one!
